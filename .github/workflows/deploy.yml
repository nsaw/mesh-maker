name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Agent skill copies and engineering docs do not ship in the site. A push
    # touching only these must not redeploy production; any push that also
    # touches site files still deploys. workflow_dispatch is unaffected.
    paths-ignore:
      - '.claude/**'
      - '.agents/**'
      - '.codex/**'
      - 'CONTEXT/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

# A manual run deploys whatever ref it is dispatched from, and the deploy step always publishes as
# --branch=main (production), so the job below runs only for main. That guard lives in each branch's
# own copy of this file, so it stops a mistaken dispatch, not a branch that edits it out. The group is
# per ref: GitHub cancels a pending run when a newer one joins the same group, so a skipped dispatch
# from another ref must never share main's group and bump a pending main deploy.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "API Token length: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler@4 pages deploy dist --project-name=meshcraft --branch=main
