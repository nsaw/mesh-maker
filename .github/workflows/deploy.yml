name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# A manual run deploys whatever ref it is dispatched from, and the deploy step always publishes as
# --branch=main (production), so the job below runs only for main. That guard lives in each branch's
# own copy of this file, so it stops a mistaken dispatch, not a branch that edits it out. The group is
# per ref: GitHub cancels a pending run when a newer one joins the same group, so a skipped dispatch
# from another ref must never share main's group and bump a pending main deploy.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "API Token length: ${#CLOUDFLARE_API_TOKEN}"
          npx wrangler@4 pages deploy dist --project-name=meshcraft --branch=main
